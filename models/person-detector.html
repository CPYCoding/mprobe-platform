<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run · Person Detector — MProbe</title>
  <link rel="stylesheet" href="run.css">
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="../marketplace.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Back to marketplace
    </a>
    <div id="app"></div>
  </div>

  <!-- ============================================================
       👋 COLLEAGUE: this <script> is the whole page's content.
       Safe to edit: title, dataset, arch, intro, and the sample
       frames below. The shared look is in run.css, the shared
       behaviour is in run.js — you usually don't need to touch those.
       ============================================================ -->
  <script>
    window.MODEL = {
      kind:    "detector",
      title:   "Person Detector (hardened)",
      slug:    "person-detector",
      dataset: "CCTV",
      arch:    "VGG-19 · ProtoPNet",
      label:   "person",     // what the model detects (used in result text)
      emoji:   "🧍",
      intro:   "Detects whether a person is present in a frame. Pick a sample frame below and run the model to see the prediction and the prototypes it matched.",
      // Each sample frame: hit=true means the object is present.
      // box = detection rectangle drawn on the frame (percent of the tile).
      samples: [
        { name:"lobby_cam_02.jpg", hit:true,  conf:96, bg:"linear-gradient(160deg,#2a3f5f,#16263f)", emoji:"🧍", box:{ t:20, l:38, w:24, h:56 } },
        { name:"empty_hall_11.jpg", hit:false, conf:0,  bg:"linear-gradient(160deg,#3a3f45,#23262b)", emoji:"" },
        { name:"night_gate_07.jpg", hit:true,  conf:88, bg:"linear-gradient(160deg,#20304a,#0f1a2b)", emoji:"🧍", box:{ t:24, l:50, w:22, h:52 } }
      ]
    };
  </script>
  <script src="run.js"></script>
</body>
</html>
